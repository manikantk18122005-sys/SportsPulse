# SportsPulse Platform Configuration
# Portable, location-independent default settings.
# All settings can be overridden via JVM System Properties (-Dsportspulse.property=value)
# or Environment Variables without modifying source code.

# Terminal ANSI Color Mode: auto | truecolor | ansi16 | mono
sportspulse.color=true
sportspulse.color.mode=auto

# Terminal Layout Width: auto | 65 | 80 | 120
sportspulse.width=auto

# Unicode Box Drawing Glyphs: auto | true | false
sportspulse.unicode=auto

# Interactive TUI Arrow Navigation: auto | true | false
sportspulse.tui=auto

# Central Runtime Data Directory (relative to project root)
sportspulse.runtime.dir=runtime

# Authentication & Defensive Security Policies
sportspulse.auth.lockout.threshold=5
sportspulse.auth.lockout.duration.seconds=300
sportspulse.auth.session.timeout.seconds=1800
